# marihydro\crates\mh_foundation\Cargo.toml

[package]
name = "mh_foundation"
version = "0.1.0"
edition = "2021"
description = "MariHydro Foundation Layer - Zero-dependency base abstractions"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
gpu-f32 = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies.tracing]
version = "0.1"
optional = true

[lints]
workspace = true
