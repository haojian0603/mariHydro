[package]
name = "mh_runtime"
version = "0.1.0"
edition = "2021"
authors = ["MariHydro Team"]
description = "MariHydro Runtime Layer - Backend, Scalar, Buffer abstractions"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0"
mh_foundation = { path = "../mh_foundation" }
bytemuck = { version = "1.14", features = ["derive"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
rayon = { version = "1.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
criterion = "0.5"

[features]
default = []
layer-guard = []  # CI中启用，防止低层crate错误引用

[lints]
workspace = true