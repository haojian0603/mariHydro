# marihydro\Cargo.toml

[workspace]
resolver = "2"
members = [
    # Layer 1: Foundation (零依赖)
    "crates/mh_foundation",
    # Layer 2: Runtime (依赖 Foundation)
    "crates/mh_runtime",
    # Layer 4: Config (依赖 Runtime)
    "crates/mh_config",
    # 功能模块
    "crates/mh_geo",
    "crates/mh_mesh",
    "crates/mh_terrain",
    "crates/mh_editor",
    "crates/mh_physics",
    "crates/mh_io",
    "crates/mh_workflow",
    # "apps/mh_desktop/src-tauri",  # Tauri app 目录为空，暂时禁用
    "apps/mh_cli",
]

[workspace.dependencies]
# 统一版本管理
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# =============================================================================
# Clippy 配置
# =============================================================================
# 
# 这些规则确保代码质量和安全性：
# - unwrap_used: 禁止使用 .unwrap()，强制显式错误处理
# - expect_used: 警告使用 .expect()，建议使用 Result 传播
# - panic: 警告直接使用 panic!，应返回 Result
# - todo: 警告遗留的 todo! 宏
# - indexing_slicing: 警告潜在的越界访问
# 
# 使用 #[allow(clippy::...)] 在特定位置临时禁用规则
# 
[workspace.lints.clippy]
# 安全相关规则 - 对于科学计算适当放宽
unwrap_used = "allow"               # 科学计算中经验证的情况使用 unwrap 是安全的
# 代码质量规则 - 警告
expect_used = "allow"               # 科学计算中 expect 用于不可能失败的情况
panic = "allow"                     # 显式 panic 用于不变量违反
todo = "warn"
unimplemented = "allow"             # 预留接口标记
# 数值安全规则 - 对于科学计算适当放宽
cast_possible_truncation = "allow"  # 科学计算中常见 f64 -> f32 等转换
cast_sign_loss = "allow"            # usize -> i32 等转换在已验证范围时是安全的
cast_precision_loss = "allow"       # 精度损失在科学计算中通常可接受
cast_lossless = "allow"             # 无损转换不需要警告
# 性能规则
large_enum_variant = "warn"
# 文档规则
missing_docs_in_private_items = "allow"  # 暂时关闭，可后续开启
doc_markdown = "allow"              # 文档中的技术术语不需要强制 markdown 格式
missing_errors_doc = "allow"        # 错误文档可选
missing_panics_doc = "allow"        # panic 文档可选
# 代码风格放宽规则
unreadable_literal = "allow"        # 科学计算中常用数字如 1e-6, 9.81 等
similar_names = "allow"             # h_l, h_r 等变量名在 CFD 中是标准命名
many_single_char_names = "allow"    # 数学公式中常用单字符变量
too_many_arguments = "allow"        # 科学计算函数参数较多是正常的
too_many_lines = "allow"            # 复杂算法函数行数较多是正常的
cognitive_complexity = "allow"      # 数值算法复杂度较高
# 其他
module_name_repetitions = "allow"   # 模块名重复在层次结构中常见
must_use_candidate = "allow"        # 不强制要求 #[must_use]
return_self_not_must_use = "allow"  # builder 模式不需要 must_use
struct_excessive_bools = "allow"    # 配置结构体可能有多个 bool
# 文档和代码风格相关 - 暂不强制
doc_nested_refdefs = "allow"        # 文档链接格式放宽
multiple_bound_locations = "allow"  # 泛型约束位置风格放宽
mixed_attributes_style = "allow"    # 属性风格混合允许
derivable_impls = "allow"           # 允许自定义 Default impl
manual_clamp = "allow"              # 手动 clamp 在有特殊逻辑时允许
manual_let_else = "allow"           # let else 风格放宽
if_not_else = "allow"               # if !condition 风格放宽
items_after_statements = "allow"    # 语句后定义项目允许
uninlined_format_args = "allow"     # 格式化参数风格放宽
float_cmp = "allow"                 # 浮点比较在科学计算中有时必要
needless_pass_by_value = "allow"    # 按值传递风格放宽
redundant_closure_for_method_calls = "allow"  # 闭包风格放宽
semicolon_if_nothing_returned = "allow"       # 分号风格放宽
single_match_else = "allow"         # match 风格放宽
match_same_arms = "allow"           # match 相同分支允许
match_wildcard_for_single_variants = "allow"  # 通配符风格放宽
unused_self = "allow"               # 未使用 self 参数允许
unnecessary_wraps = "allow"         # 不必要包装允许
trivially_copy_pass_by_ref = "allow"  # 简单类型传递方式放宽
type_complexity = "allow"           # 复杂类型在科学计算中常见
if_same_then_else = "allow"         # 相同分支可能是故意的
while_let_loop = "allow"            # 循环风格放宽
assign_op_pattern = "allow"         # 赋值操作风格放宽
unnecessary_unwrap = "allow"        # 不必要的 unwrap 放宽
ptr_arg = "allow"                   # 指针参数风格放宽
default_trait_access = "allow"      # Default 访问风格放宽
implicit_clone = "allow"            # 隐式克隆放宽
clone_on_copy = "allow"             # copy 类型的 clone 放宽
len_zero = "allow"                  # len == 0 风格放宽
option_if_let_else = "allow"        # Option if let else 风格放宽
unnecessary_cast = "allow"          # 不必要的类型转换放宽
needless_range_loop = "allow"       # range 循环风格放宽
useless_vec = "allow"               # vec! 使用风格放宽
should_implement_trait = "allow"    # trait 实现建议放宽
struct_field_names = "allow"        # 结构体字段名放宽
identity_op = "allow"               # 1 * 1024 等用于可读性
manual_memcpy = "allow"             # 手动内存复制在某些场景更清晰
unnecessary_lazy_evaluations = "allow"  # lazy 评估风格放宽
field_reassign_with_default = "allow"   # Default 后赋值风格放宽
collapsible_else_if = "allow"       # else if 风格放宽
len_without_is_empty = "allow"      # len 方法不强制 is_empty
needless_borrows_for_generic_args = "allow"  # 借用风格放宽
unused_enumerate_index = "allow"    # 未使用的枚举索引放宽
redundant_field_names = "allow"     # 冗余字段名放宽
redundant_closure_call = "allow"    # 冗余闭包调用放宽
empty_line_after_outer_attr = "allow"  # 属性后空行风格放宽
let_and_return = "allow"            # let 后 return 风格放宽
new_ret_no_self = "allow"           # new 方法返回其他类型放宽
empty_line_after_doc_comments = "allow"  # 文档注释后空行放宽
needless_update = "allow"           # 不必要的更新语法放宽
redundant_closure = "allow"         # 冗余闭包放宽

[workspace.lints.rust]
# 启用更严格的 Rust lint
unsafe_code = "warn"  # 警告使用 unsafe，强制添加 SAFETY 注释

